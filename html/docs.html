    <div id="recruitment-modal" class="employee-modal">
      <div class="employee-modal-content">
        <div class="employee-modal-header">
          <h2>Alkalmazott felvétele</h2>
          <button class="employee-modal-close" onclick="closeRecruitmentModal()">&times;</button>
        </div>
        <div class="employee-modal-body">
          <div class="employee-modal-body">
            <form id="recruitment-form">
              <div class="employee-form-group">
                <label for="available-employees">Dokumentum típusának kiválasztása:</label>
                <select id="available-employees" class="employee-form-input" required>
                  <option value="">-- Válasszon típust --</option>
                  <option value="public">Publikus</option>
                  <option value="private">Céges</option>
                </select>
              </div>

              <div class="employee-form-group">
                <label for="recruitment-position-title">Dokumentum címe:</label>
                <input
                  type="text"
                  id="recruitment-position-title"
                  class="employee-form-input"
                  placeholder="pl. Ügyfél lista"
                  required
                />
              </div>

              <div class="employee-form-group">
                <label for="recruitment-position-content">Tartalom:</label>
                <textarea
                  id="recruitment-position-content"
                  class="employee-form-input"
                  rows="5"
                  required
                ></textarea>
              </div>

              <div class="employee-modal-buttons">
                <button
                  type="button"
                  class="employee-modal-btn employee-modal-btn-submit"
                  onclick="submitRecruitment()"
                >
                  Létrehozás
                </button>
                </div>
            </form>
          </div>
      </div>
