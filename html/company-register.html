  <script>
function ShowAlert(message, type) {
  // Store alert in sessionStorage for persistence after reload
  sessionStorage.setItem(
    "pendingAlert",
    JSON.stringify({
      message: message,
      type: type,
    }),
  );

  displayAlert(message, type);
}

function displayAlert(message, type) {
  let body = document.getElementsByTagName("body")[0];
  let alertBox = document.createElement("div");
  alertBox.className = "alert-box";
  alertBox.textContent = message;
  document.body.appendChild(alertBox);
  alertBox.style.opacity = "0.7";
  alertBox.style.position = "fixed";
  alertBox.style.top = "20px";
  alertBox.style.right = "20px";
  alertBox.style.padding = "15px";
  alertBox.style.color = "white";
  alertBox.style.borderRadius = "5px";
  alertBox.style.zIndex = "1000";
  alertBox.style.transition = "opacity 0.5s ease";
  alertBox.style.borderRadius = "10px";
  alertBox.style.fontFamily = "Arial, sans-serif";
  alertBox.style.fontSize = "16px";
  if (type == "alert") {
    alertBox.style.backgroundColor = "#f44336";
  } else if (type == "success") {
    alertBox.style.backgroundColor = "#4CAF50";
  } else {
    alertBox.style.backgroundColor = "#333";
  }

  setTimeout(() => {
    alertBox.remove();
  }, 3000);
}

// Check for pending alerts when page loads
window.addEventListener("load", function () {
  const pendingAlert = sessionStorage.getItem("pendingAlert");
  if (pendingAlert) {
    try {
      const alertData = JSON.parse(pendingAlert);
      displayAlert(alertData.message, alertData.type);
      sessionStorage.removeItem("pendingAlert");
    } catch (e) {
      console.error("Error displaying pending alert:", e);
      sessionStorage.removeItem("pendingAlert");
    }
  }
});


    function LoadCompanyRegister() {
      const existingCompanysSection = document.getElementById(
        "company-register-existing-companys",
      );
      const companyRegisterSection = document.getElementById(
        "company-register-section",
      );

      // Itt lehetne egy API hívást tenni, hogy lekérjük a már létrehozott cégeket
      var xhr = new XMLHttpRequest();
      xhr.open("POST", `${API_BASE_URL}/company/owner/`, true);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          const companys = JSON.parse(xhr.responseText);
          console.log(JSON.parse(xhr.responseText));
          console.log(companys);
          // Itt lehetne egy ciklussal végigmenni a companys tömbön és megjeleníteni az adatokat
          if (companys.companies.length > 0) {
            companys.companies.forEach((company) => {
              const companyElement = document.createElement("div");
              companyElement.innerHTML = `<h3>${company.CompanyName}</h3><p>${company.Address}</p>`;
              existingCompanysSection.appendChild(companyElement);
              companyElement.addEventListener("click", function () {
                // Itt lehetne egy API hívást tenni, hogy lekérjük a cég részletes adatait és megjelenítsük azokat egy új oldalon vagy egy modális ablakban
                ShowAlert(`Cég kiválasztva: ${company.CompanyName}`, "success");
                sessionStorage.setItem("SelectedCompany", JSON.stringify(company.Company_ID));
                window.location.reload();
              });
            });
          } else {
            existingCompanysSection.innerHTML =
              "<p>Nincsenek létrehozott cégek ezzel a profillal.</p>";
          }
        } else if (xhr.readyState === 4) {
          console.error("Hiba a cégek lekérése során: " + xhr.status);
          existingCompanysSection.innerHTML =
            "<p>Hiba a cégek lekérése során. Kérem próbálja újra később.</p>";
        }
      };
      xhr.send(
        JSON.stringify({
          ownerId: JSON.parse(localStorage.getItem("Profile")), // Example ownerId value - in a real app, this would be dynamically set
        }),
      );

      // és megjelenítsük őket az existingCompanysSection-ben

      // Itt lehetne egy űrlapot létrehozni a companyRegisterSection-ben, ahol a felhasználó megadhatja a cég adatait és regisztrálhatja azt
    }

    function CreateCompanyRegisterForm() {
      const companyRegisterSection = document.getElementById(
        "company-register-section",
      );
      const formHTML = `
            <form id="company-register-form">
                <label for="company-name">Cég neve:</label>
                <input type="text" id="company-name" name="company-name" required>
                
                <label for="company-address">Cég címe</label>
                <textarea id="company-address" name="company-address" required></textarea>

                <label for="company-phone">Cég telefonszáma:</label>
                <input type="text" id="company-phone" name="company-phone" required>

                <label for="company-tax">Cég adószáma:</label>
                <textarea id="company-tax" name="company-tax" required></textarea>
                
                <button type="submit" style="color: var(--text-color)">Regisztráció</button>
            </form>
        `;
      companyRegisterSection.innerHTML += formHTML;

      const form = document.getElementById("company-register-form");
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        // Itt lehetne egy API hívást tenni, hogy regisztráljuk a céget a megadott adatokkal

        var xhr = new XMLHttpRequest();
        xhr.open("POST", `${API_BASE_URL}/createCompany`, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            ShowAlert("Cég sikeresen regisztrálva!", "success");
            LoadCompanyRegister(); // Frissítjük a listát
          } else if (xhr.readyState === 4) {
            alert("Hiba a cég regisztrálása során!");
          }
        };
        xhr.send(
          JSON.stringify({
            taxnumber: document.getElementById("company-tax").value,
            address: document.getElementById("company-address").value,
            mobile: document.getElementById("company-phone").value,
            owner: JSON.parse(localStorage.getItem("Profile")),
            name: document.getElementById("company-name").value,
          }),
        );
      });
    }

    LoadCompanyRegister();
    CreateCompanyRegisterForm();
  </script>
