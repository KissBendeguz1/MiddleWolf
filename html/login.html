    <div id="contentholder">

              <img class="sidebar-icon" src="../assets/main.png" alt="Home" />
              <h2>Főoldal</h2>
            </div>
          </a>
          <a href="../html/about.html">
            <div class="sidebar-item">
              <img class="sidebar-icon" src="../assets/about.png" alt="About" />
              <h2>Rólunk</h2>
            </div>
          </a>
          <a href="../html/map.html">
            <div class="sidebar-item">
              <img class="sidebar-icon" src="../assets/map.png" alt="Map" />
              <h2>Térkép</h2>
            </div>
          </a>
          <a href="../html/contact.html">
            <div class="sidebar-item">
              <img
                class="sidebar-icon"
                src="../assets/contact.png"
                alt="Contact"
              />
              <h2>Kapcsolat</h2>
            </div>
          </a>
        </div>
        <div class="sidebar-bottom">

      <div class="login-wrapper">
        <div class="login-header">
          <h1 id="title">Regisztráció</h1>
          <p id="subtitle">Kérjük, jelentkezzen be vagy regisztráljon</p>
        </div>
        <div class="login-form-container">
          <form id="logReg_form">
            <div class="login-tabs">
              <button class="tab-btn" id="log" type="button" onclick="Login()">
                Bejelentkezés
              </button>
              <button
                class="tab-btn active"
                id="reg"
                type="button"
                onclick="Registration()"
              >
                Regisztráció
              </button>
            </div>

            <div id="Name" class="form-group">
              <label>Név</label>
              <input type="text" id="con_name" placeholder="Gipsz Jakab" />
            </div>

            <div id="Email" class="form-group">
              <label>Név/Email</label>
              <input type="email" id="con_email" placeholder="ceg@gmail.com" />
            </div>

            <div id="Password" class="form-group">
              <label>Jelszó</label>
              <div class="input-container">
                <input type="password" id="con_Password" placeholder="••••••••" />
                <span class="password-toggle" data-target="con_Password" title="Jelszó megjelenítése">👁️</span>
              </div>
              <div class="password-strength">
                <div class="strength-bar"></div>
                <span class="strength-text"></span>
              </div>
            </div>

            <div id="Password_again" class="form-group">
              <label>Jelszó Újra</label>
              <div class="input-container">
                <input
                  type="password"
                  id="con_Password_again"
                  placeholder="••••••••"
                />
                <span class="password-toggle" data-target="con_Password_again" title="Jelszó megjelenítése">👁️</span>
              </div>
            </div>

            <div id="Mobile" class="form-group">
              <label>Telefonszám</label>
              <input
                type="tel"
                id="con_mobile"
                inputmode="numeric"
                placeholder="06308769567"
                maxlength="11"
              />
            </div>

            <div id="Profile_type" class="form-group">
              <label for="profile_type">Profil típusa</label>
              <select id="profile_type">
                <option value="private">
                  Személyes vagy alkalmazotti fiók
                </option>
                <option value="company">Cégtulajdonos fiók</option>
              </select>
            </div>

            <div class="login-buttons">
              <button type="submit" id="con_submit" class="btn-submit">
                Küldés
              </button>
            </div>
          </form>
        </div>

        <!--    <div id="Box">
          <div class="Box-content">
            <h1 id="BoxH1"></h1>
            <p id="BoxP"></p>
          </div>
        </div>
      -->

        <div class="form-toggle">
          <p id="toggle-text">
            Már van fiókja? <a onclick="Login()">Bejelentkezés</a>
          </p>
        </div>
      </div>

    <script src="../js/login.js"></script>
    <script src="../js/LoadSideNavBar.js\"></script>
    <script src="../js/ShowAlert.js"></script>
  </body>
  <script src="../js/manageNav.js"></script>
  <script>
    /**
 * LoadSideNavBar.js - Csak a megjelenítésért és resizolásért felel.
 * Minden API hívás és profil-alapú navigáció-módosítás eltávolítva.
 */

const darkModeScript = document.createElement("script");
darkModeScript.src = "../js/DarkMode.js";
document.head.appendChild(darkModeScript);

document.addEventListener("DOMContentLoaded", () => {
    // Navigációs elemek kezelése (Be/Kijelentkezés szöveg)
    const account_log_in_out = document.getElementsByClassName("account_log_in_out");
    if (account_log_in_out.length > 0) {
        if (sessionStorage.getItem("Login") === "true") {
            account_log_in_out[0].innerHTML = "Kijelentkezés";
            account_log_in_out[0].href = "#";
            
            // Logout esemény figyelő
            account_log_in_out[0].addEventListener("click", (e) => {
                e.preventDefault();
                openLogoutConfirmModal();
            });
        } else {
            account_log_in_out[0].innerHTML = "Bejelentkezés";
        }
    }

    // Sidebar méretezés és hamburger menü indítása
    ManageNavResize();
});

function ManageNavResize() {
    const sidebar = document.querySelector(".sidebar-container");
    const nav = document.querySelector(".nav-container");
    
    if (!sidebar || !nav) return;

    // Hamburger menü gomb létrehozása
    const menudiv = document.createElement("div");
    menudiv.id = "sidemenuopen";
    menudiv.classList.add("hidden");
    menudiv.innerHTML = `
        <svg class="svg-invert" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6H20M4 12H20M4 18H20" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>`;
    
    menudiv.addEventListener("click", () => {
        sidebar.classList.toggle("hidden");
    });

    nav.prepend(menudiv);

    // Képernyőméret figyelése
    function checkLayout() {
        const screenwidth = window.innerWidth;
        if (screenwidth <= 1400) {
            menudiv.classList.remove("hidden");
            sidebar.classList.add("hidden");
        } else {
            menudiv.classList.add("hidden");
            sidebar.classList.remove("hidden");
        }
    }

    window.addEventListener("resize", checkLayout);
    checkLayout(); // Első futtatás betöltéskor
}

// Logout Modul (Megmaradt a működéshez)
function openLogoutConfirmModal() {
    if (!document.getElementById("logout-confirm-modal")) {
        const modalHTML = `
          <div id="logout-confirm-modal" class="modal" style="display: none;">
            <div class="modal-content">
              <div class="modal-header">
                <h2>Kijelentkezés</h2>
                <span class="close-modal" onclick="closeLogoutConfirmModal()">&times;</span>
              </div>
              <div class="modal-body"><p>Biztos, hogy ki szeretnél jelentkezni?</p></div>
              <div class="modal-footer">
                <button class="btn-cancel" onclick="closeLogoutConfirmModal()">Mégsem</button>
                <button class="employee-modal-btn employee-modal-btn-submit" onclick="confirmLogout()">Igen</button>
              </div>
            </div>
          </div>`;
        document.body.insertAdjacentHTML("beforeend", modalHTML);
    }
    document.getElementById("logout-confirm-modal").style.display = "flex";
}

function closeLogoutConfirmModal() {
    const modal = document.getElementById("logout-confirm-modal");
    if (modal) modal.style.display = "none";
}

function confirmLogout() {
    if (localStorage.getItem("darkMode") === "true") {
        localStorage.removeItem("Profile");
    } else {
        localStorage.clear();
    }
    sessionStorage.clear();
    window.location.href = "../html/index.html";
}
  </script>
</html>
