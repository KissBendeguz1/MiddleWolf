function refreshPage() {
  window.location.reload();

const employeeListContainer = document.getElementById("employee-list-container");
    function loadEmployees() {
      var xhr = new XMLHttpRequest();
  xhr.open("POST", `${API_BASE_URL}/employee/cegId/`, true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        var response = JSON.parse(xhr.responseText);
        if (!response.employees) {
          employeeListContainer.innerHTML = `<p style="text-align: center">Nincsenek felvett alkalmazottak</p>`;
          return;
        } else {
          var employees = response.employees; // Feltételezve, hogy a válaszban van egy "employees" mező
          employeeListContainer.innerHTML = "";
          employees.forEach(function (employee) {
            loadEmployee(employee.Profile_ID, employee.position);
          });
        }
        

    }
  };
}

  xhr.send(
    JSON.stringify({
      companyId: sessionStorage.getItem("SelectedCompany"),
    }),
  );
  }

  function loadEmployee(profileid, position) {
    console.log(profileid);
    var xhr = new XMLHttpRequest();
    const container = document.getElementById("employee-list-container");
  xhr.open("POST", `${API_BASE_URL}/profiles/id/`, true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        var response = JSON.parse(xhr.responseText);
        console.log(response);
        var employee = response.user; // Feltételezve, hogy a válaszban van egy "profile" mező
        div = document.createElement("div")
          div.classList.add("employee-item")
          div.innerHTML += `<div class="employee-item-inner">
                    <img src="../assets/people.svg" alt="" />
                    <div class="employee-item-text">
                        <h2>${employee.Name || employee.name}</h2>

                    </div>
                </div>
                <div class="employee-item-buttons">
                    <button onclick="ShowAlert('Még nem elkészült funkcio', 'alert')" class="employee-item-button">Üzenet</button>
                    <button onclick="ModifyEmployee(${profileid|| employee.ID})" class="employee-item-button">Kezelés</button>
                </div>`

                container.appendChild(div)


      }
    }
  };
  console.log(profileid);
  xhr.send(
    JSON.stringify({
      "id": profileid,
    }),
  );
}

  loadEmployees();


  function openRecruitmentModal() {
    const modal = document.getElementById("recruitment-modal");
    if (modal) {
      modal.style.display = "flex";
      document.getElementById("recruitment-form").reset();
      // Load available employees when modal opens
      const select = document.getElementById("available-employees");
      const xhr = new XMLHttpRequest();
      xhr.open("POST", `${API_BASE_URL}/availableEmployees/private/`, true);
      xhr.setRequestHeader("Content-Type", "application/json");

      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            var response = JSON.parse(xhr.responseText);
            if (response.success && response.users && response.users.length > 0) {
              populateEmployeesDropdown(response.users);
            }
          }
        } else {
          console.error("Hiba történt az elérhető alkalmazottak lekérésekor:", xhr.statusText);
        }
      };

      xhr.send(JSON.stringify({}));
    }
  }

  function closeRecruitmentModal() {
    const modal = document.getElementById("recruitment-modal");
    if (modal) {
      modal.style.display = "none";
      document.getElementById("recruitment-form").reset();
    }
  }

  function openPositionModal(id) {
    const modal = document.getElementById("position-modal");
    if (modal) {
      modal.style.display = "flex";
      document.getElementById("position-form").reset();
      saveId(id)
      

    }
  }

  function saveId(id) {
    sessionStorage.setItem("SelectedEmployeeForRoleChange", id);
  }

  function fireEmployee() {
    const employeeId = sessionStorage.getItem("SelectedEmployeeForRoleChange");
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${API_BASE_URL}/deleteEmployee`, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          var response = JSON.parse(xhr.responseText);
          if (response.success) {
            ShowAlert("Alkalmazott kirúgva", "success");
            closePositionModal();
            refreshPage(); // Refresh the page after successful operation
          } else {
            ShowAlert(": " + response.message, "success");
            refreshPage();
          }
        } else {
          ShowAlert("Hiba történt az alkalmazott kirúgásakor: " + xhr.statusText, "alert");
        }
      }
    };
    xhr.send(JSON.stringify({
      "employeeid": employeeId
    }));
  }

  function populateEmployeesDropdown(employees) {
    const select = document.getElementById("available-employees");
    select.innerHTML = '<option value="">-- Válasszon --</option>';
    employees.forEach(employee => {
      const option = document.createElement("option");
      option.value = employee.ID; // Feltételezve, hogy az ID mező "id" néven van
      option.textContent = employee.name; // Feltételezve, hogy a név mező "name" néven van
      select.appendChild(option);
    });
  }

  function closePositionModal() {
    const modal = document.getElementById("position-modal");
    if (modal) {
      modal.style.display = "none";
      document.getElementById("position-form").reset();
    }
  }

      xhr.setRequestHeader("Content-Type", "application/json");

          if (xhr.status === 200) {
            var response = JSON.parse(xhr.responseText);
            if (response.success) {
              ShowAlert("Alkalmazott felvéve", "success");
              closeRecruitmentModal();
              refreshPage(); // Refresh the page after successful operation
            } else {
              ShowAlert("" + response.message, "success");
              refreshPage();

          } else {
            ShowAlert("Hiba történt az alkalmazott felvételkor: " + xhr.statusText, "alert");

        }
      };
          xhr.send(JSON.stringify({

        if (xhr.readyState === 4) {

            if (response.success) {
              ShowAlert("Pozíció módosítva", "success");
              closePositionModal();
              refreshPage(); // Refresh the page after successful operation
            } else {
              ShowAlert("" + response.message, "success");
              refreshPage();
            }
          } else {
            ShowAlert("Hiba történt a pozíció módosításakor: " + xhr.statusText, "alert");
          }
        }
      };
          xhr.send(JSON.stringify({
      "userId": sessionStorage.getItem("SelectedEmployeeForRoleChange"),
      "newPosition": newPosition
          }));
      };
