        <script>
                  function ProfileType() {
          if (sessionStorage.getItem("Profile_Type")) {
            return sessionStorage.getItem("Profile_Type");
          } else {
            return null;
          }
        }

        function LoadNotifications() {
          const profileType = ProfileType();
          if (profileType === "Employee") {
            LoadEmployeeAlerts();
            LoadGlobalAlerts();
          } else if (profileType === "Owner") {
            LoadOwnerAlerts();
          } else {
            LoadGlobalAlerts();
          }
        }

        function LoadGlobalAlerts() {
          xhr = new XMLHttpRequest();
          console.log("LoadGlobalAlerts futtatva");
          xhr.open("POST", `${API_BASE_URL}/alerts/global`, true);
          xhr.setRequestHeader("Content-Type", "application/json");
          xhr.onreadystatechange = function () {
            
            if (xhr.readyState === 4) {
              if (xhr.status === 200) {
                console.log("Global alerts loaded successfully");
                const response = JSON.parse(xhr.responseText);
                console.log("Global alerts response:", response);
                console.log("Global alerts response length:", response.length);
                const alerts = response.alerts
                const globalcontainer = document.getElementById("notification-container-global");
                document.getElementById("notification-container-global").innerHTML = "";
                for (let i = 0; i < alerts.length; i++) {
                  const alert = alerts[i];
                  const alertHTML = `
                    <div class="notification-item">
                      <div class="notification-header">
                        <h3>${alert.alert_Title}</h3>
                        <span class="notification-date">${new Date(alert.date).toLocaleDateString()}</span>
                      </div>
                      <p class="notification-content">${alert.alert_Body}</p>
                    </div>
                  `;
                  document.getElementById("notification-container-global").innerHTML += alertHTML;
                }
              }
            }
          };
          xhr.send(JSON.stringify({}));
        }

        function LoadEmployeeAlerts() {
          console.log("LoadEmployeeAlerts futtatva");
        }

        function LoadOwnerAlerts() {
          console.log("LoadOwnerAlerts futtatva");
        }

        LoadNotifications();
        </script>
